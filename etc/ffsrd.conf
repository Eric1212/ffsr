# ffsrd.conf — configuration du daemon ffsrd
# Copiée vers /etc/ffsrd/conf par `make install`.

# Port du remote-debugging de Firefox (le « pont »)
port=9222

# Utilisateur cible pour qui le daemon agit (le possesseur de Firefox)
FFSRD_TARGET_UID=1000

# Socket d'exposition (ne pas changer sans raison)
socket_path=/run/ffsrd/ffsr.sock

# État persistant (unique, système)
state_path=/var/lib/ffsrd/state