# ffsrd.conf — ffsrd daemon configuration
# Copied to /etc/ffsrd/conf by `make install`.

# Firefox remote-debugging port (the "bridge")
port=9222

# Target user the daemon acts for (the Firefox owner)
FFSRD_TARGET_UID=1000

# Exposure socket (do not change without reason)
socket_path=/run/ffsrd/ffsr.sock

# Persistent state (unique, system-wide)
state_path=/var/lib/ffsrd/state
